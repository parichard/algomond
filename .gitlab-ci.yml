image: node:latest

before_script:
    - apt-get update -qy
    - apt-get install -y ruby-dev
    - gem install dpl

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - cd client
    - yarn install
    - yarn run build
    - cp -r dist ../server/
  artifacts:
    paths:
      - server/dist
  only:
    - dev

build-server:
  stage: build
  script:
    - cd server
    - yarn install
    - yarn run build-typescript
  artifacts:
    paths:
      - server/build
  only:
    - dev

deploy-dev-client:
  stage: deploy
  image: ruby:latest
  script:
    - cd server
    - mv dist Procfile package.json build
    - cd build
    - dpl --provider=heroku --app=$HEROKU_DEV_CLIENT --api-key=$HEROKU_API_KEY --skip_cleanup
  only:
    - dev
